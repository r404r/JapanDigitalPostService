openapi: 3.0.3
info:
  title: JapanDigitalPostService API
  version: 0.1.0
  description: >
    日本邮政地址检索服务。基于 token 认证，提供邮编/都道府県/市区町村/模糊查询，
    以及同步状态与 token 管理。本契约为 spec-first 源文件，用 oapi-codegen 生成 Go server。
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness/readiness
      security: []
      operationId: getHealth
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /addresses:
    get:
      summary: 地址查询（邮编/都道府県/市区町村/模糊）
      operationId: searchAddresses
      parameters:
        - { name: zipcode, in: query, schema: { type: string }, description: 7 位邮编或前缀 }
        - { name: prefecture, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 跨字段模糊关键字 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 查询结果（含 too_many_results / timeout 等状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /addresses/{zipcode}:
    get:
      summary: 按邮编精确查询（一个邮编可对应多町域）
      operationId: getAddressByZipcode
      parameters:
        - { name: zipcode, in: path, required: true, schema: { type: string }, description: 7 位邮编（精确） }
      responses:
        '200':
          description: ok（含 address_count = 该邮编的地址条数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /sync/status:
    get:
      summary: 当前同步状态
      operationId: getSyncStatus
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sync/runs:
    get:
      summary: 同步运行历史
      operationId: listSyncRuns
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncRun' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sync/runs/{id}/skipped:
    get:
      summary: 同步运行的跳过明细
      operationId: listSyncSkippedRows
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncSkippedRow' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /sync/trigger:
    post:
      summary: 手动触发同步（admin）
      operationId: triggerSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [auto, full, diff]
                  description: >
                    auto = 库空走 full、否则 diff（引擎解析）；full = 强制全量重建；
                    diff = 强制差分。落库的 SyncRun.type 始终是 full 或 diff（auto 不落库）。
              required: [type]
      responses:
        '202':
          description: accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncRun' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /sync/upload:
    post:
      summary: zip/csv アップロードによる全量同期（admin）
      operationId: uploadSync
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 日本郵政 utf_ken_all の zip、または解凍済み UTF-8 csv。
              required: [file]
      responses:
        '200':
          description: completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncRun' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      summary: 读取运行时抓取设置（admin）
      operationId: getAdminSettings
      description: >
        返回管理画面可配置、重启后保留的运行时设置。每项含当前有效值 `value`、
        默认值 `default`（“恢复默认”将回退到此），以及是否被 DB 覆盖 `overridden`。
        有效值优先级 DB 覆盖 > env > 代码默认（见 docs/architecture.md §9.1）。
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      summary: 更新运行时抓取设置（admin）
      operationId: updateAdminSettings
      description: >
        部分更新：省略的字段保持不变；列在 `reset_to_default` 中的键删除其覆盖值
        以恢复默认（对应管理画面“恢复默认”按钮）。同一键不可同时设值与重置。
        校验失败返回 400 `invalid_request`，`message` 为日语提示（URL 需 https 且
        属日本邮便官方域名，重试次数 0–10）。返回应用后的完整设置视图。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettingsUpdate' }
      responses:
        '200':
          description: 更新后的设置视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tokens:
    get:
      summary: 列出 token（脱敏，admin scope）
      operationId: listTokens
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TokenInfo' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: 发行 token（admin scope，明文仅返回一次）
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                scope: { type: string, enum: [read, admin] }
                ttl_seconds:
                  type: integer
                  format: int64
                  minimum: 1
                  description: 可选过期时长（秒）；省略=永不过期
              required: [name, scope]
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenInfo'
                  - type: object
                    properties:
                      token: { type: string, description: 明文 token，仅此一次返回 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /tokens/{id}:
    delete:
      summary: 吊销 token（admin scope，立即生效）
      operationId: revokeToken
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
    Address:
      type: object
      properties:
        zipcode: { type: string }
        jis_code: { type: string }
        prefecture: { type: string }
        prefecture_kana: { type: string }
        city: { type: string }
        city_kana: { type: string }
        town: { type: string }
        town_kana: { type: string }
    SearchResult:
      type: object
      description: >
        查询成功响应。超时/参数非法/未认证等不返回本结构，而是 Error（见各端点的
        400/401/404/504 响应）。
      required: [status, total_count, returned_count, truncated, items]
      properties:
        status:
          type: string
          description: ok = 正常或零命中；too_many_results = 命中数超过 MAX_TOTAL。
          enum: [ok, too_many_results]
        total_count:
          type: integer
          description: 满足条件的总命中数（可能远大于 returned_count）。
        returned_count:
          type: integer
          description: 本次实际返回的 items 条数（模糊查询硬上限 = FUZZY_LIMIT，默认 20）。
        truncated:
          type: boolean
          description: total_count > returned_count 时为 true。
        address_count:
          type: integer
          description: >
            仅 GET /addresses/{zipcode} 返回：该邮编定位到的地址条数
            （一个邮编可对应多个町域）。列表/模糊查询不含此字段。
        items:
          type: array
          items: { $ref: '#/components/schemas/Address' }
    SyncStatus:
      type: object
      properties:
        total_addresses: { type: integer }
        running: { type: boolean }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_type: { type: string, enum: [full, diff], nullable: true }
    SyncRun:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [full, diff] }
        status: { type: string, enum: [running, success, failed] }
        trigger: { type: string, enum: [schedule, manual, upload] }
        source_url: { type: string, description: 下载来源 URL }
        file_checksum: { type: string, description: 下载 zip 的 SHA-256 }
        file_size: { type: integer, description: 下载 zip 字节数 }
        diff_period: { type: string, nullable: true, description: 差分目标月份 YYMM（diff 专用） }
        rows_added: { type: integer }
        rows_updated: { type: integer }
        rows_deleted: { type: integer }
        rows_skipped: { type: integer }
        rows_total: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer }
        error_message: { type: string, nullable: true }
    SyncSkippedRow:
      type: object
      properties:
        id: { type: integer }
        run_id: { type: string }
        source_type: { type: string, enum: [full, add] }
        line_number: { type: integer }
        zipcode: { type: string }
        jis_code: { type: string }
        prefecture: { type: string }
        city: { type: string }
        town: { type: string }
        town_kana: { type: string }
        reason: { type: string, example: town_regex }
        pattern: { type: string, description: 匹配到该行的町域名过滤正则 }
        raw_record_json: { type: string, description: 原始 CSV record 的 JSON 数组字符串 }
        created_at: { type: string, format: date-time }
    AdminSettings:
      type: object
      description: >
        运行时抓取设置视图。每项的 value/default 类型按键而定（重试为整数、URL 为字符串）。
      required: [download_max_retry, scrape_full_url, town_skip_regex]
      properties:
        download_max_retry:
          type: object
          description: 抓取下载的额外重试次数（有效值 0–10）。
          required: [value, default, overridden]
          properties:
            value: { type: integer, description: 当前有效值 }
            default: { type: integer, description: 默认值（恢复默认将回退到此） }
            overridden: { type: boolean, description: 是否存在 DB 覆盖 }
        scrape_full_url:
          type: object
          description: 全量抓取数据源 URL（https + 日本邮便官方域名）。
          required: [value, default, overridden]
          properties:
            value: { type: string }
            default: { type: string }
            overridden: { type: boolean }
        town_skip_regex:
          type: object
          description: 导入时按町域名跳过记录的 Go 正则表达式。空字符串表示不启用。
          required: [value, default, overridden]
          properties:
            value: { type: string }
            default: { type: string }
            overridden: { type: boolean }
    AdminSettingsUpdate:
      type: object
      description: >
        部分更新运行时设置。省略字段不变；reset_to_default 列出的键恢复默认。
        同一键不可同时出现在设值字段与 reset_to_default 中。
      properties:
        download_max_retry:
          type: integer
          minimum: 0
          maximum: 10
          description: 设置重试次数覆盖值（0–10）。
        scrape_full_url:
          type: string
          description: 设置全量 URL 覆盖值（必须 https 且属日本邮便官方域名）。
        town_skip_regex:
          type: string
          description: 设置町域名过滤正则；空字符串等同恢复默认/关闭。
        reset_to_default:
          type: array
          items: { type: string, enum: [download_max_retry, scrape_full_url, town_skip_regex] }
          description: 恢复默认（删除覆盖值）的键列表。
    TokenInfo:
      type: object
      description: 脱敏的 token 元数据；绝不含明文或 hash。
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 明文前 8 位，便于识别，不可反推 }
        scope: { type: string, enum: [read, admin] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: 为空=永不过期 }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: 机器可读状态码（spec §7）。
          enum: [too_many_results, timeout, invalid_request, unauthorized, forbidden, not_found, rate_limited, internal_error, sync_running, unsupported_file, unzip_failed, csv_format_error]
        message: { type: string, description: 人类可读说明 }
        trace_id: { type: string, description: 关联请求的 X-Request-Id，便于排查 }
