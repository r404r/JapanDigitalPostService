# Full-stack manual-test environment: Go API + production React build + optional DB services.
# Usage: docker compose -f deployments/manual-test.compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deployments/manual-test.Dockerfile
    env_file:
      - ./manual-test.env
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postal
      POSTGRES_PASSWORD: postal
      POSTGRES_DB: postal
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - manual-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postal -d postal"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: postal
      MYSQL_USER: postal
      MYSQL_PASSWORD: postal
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - manual-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  app-data:
  manual-pgdata:
  manual-mysqldata:
